name: Android sideload key (one time)

# 직접 설치(APK)용 새 서명 키를 GitHub 안에서 만든다 (한 번만, 직접 실행).
# 키는 Secrets 의 SIDELOAD_PASSPHRASE 로 잠근 채 (AES-256) android/keystore/sideload.jks.gpg 로만 저장소에 들어가고,
# 잠그지 않은 키 · 암호는 어디에도 남지 않는다 (로그에는 공개해도 되는 인증서 지문만).
on:
  workflow_dispatch:
    inputs:
      replace:
        description: "이미 있는 키를 새 키로 바꾸기 (테스터 모두 다시 설치해야 함)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  make-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make and lock the key
        env:
          P: ${{ secrets.SIDELOAD_PASSPHRASE }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          if [ -z "$P" ]; then echo "::error::Secrets 에 SIDELOAD_PASSPHRASE 가 없습니다"; exit 1; fi
          if [ "${#P}" -lt 16 ]; then echo "::error::SIDELOAD_PASSPHRASE 는 16자 이상이어야 합니다"; exit 1; fi
          OUT=android/keystore/sideload.jks.gpg
          if [ -f "$OUT" ] && [ "$REPLACE" != "true" ]; then echo "::error::키가 이미 있습니다 (바꾸려면 replace 를 켜고 실행)"; exit 1; fi
          KS="$RUNNER_TEMP/sideload.jks"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias sideload -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass:env P -keypass:env P -dname "CN=Carpe Diem sideload, O=graviton94" >/dev/null
          keytool -list -v -keystore "$KS" -storepass:env P -alias sideload | grep -E "SHA256:" | head -1
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$OUT" "$KS" 3<<<"$P"
          rm -f "$KS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "New sideload signing key, locked with the SIDELOAD_PASSPHRASE secret"
          git push
