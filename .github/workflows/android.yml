name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "design/**", "data/**", "scripts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "design/**", "data/**", "scripts/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generated files are up to date
        run: python3 scripts/generate.py --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 직접 설치용 서명 키는 GitHub Secrets 에만 (SIDELOAD_KEYSTORE_BASE64 · SIDELOAD_STORE_PASSWORD · SIDELOAD_KEY_PASSWORD)
      - name: Sideload signing key
        env:
          KS: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/sideload.jks"; echo "CD_SIDELOAD_STORE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"
          else echo "::warning::SIDELOAD_KEYSTORE_BASE64 이 없어 debug 키로 서명합니다 (테스터 폰에 덮어 설치할 수 없음)"; fi
      - name: Test and build APK
        working-directory: android
        env:
          CD_SIDELOAD_STORE_PASSWORD: ${{ secrets.SIDELOAD_STORE_PASSWORD }}
          CD_SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -120 || true
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/CarpeDiem-${{ github.run_number }}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: CarpeDiem-apk
          path: out/*.apk
      - name: Publish to GitHub release (android-latest)
        # 올리는 건 ‘릴리즈하자’ 할 때만 (Actions → Android → Run workflow). push 는 빌드 · 시험만
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 직접 설치용 키로 서명한 것만 올림 (다른 키면 테스터 폰에 덮어 설치가 안 됨)
          if [ -z "${CD_SIDELOAD_STORE:-}" ]; then echo "::error::SIDELOAD_* Secrets 가 없어 릴리즈하지 않습니다"; exit 1; fi
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest out/*.apk --prerelease --target "${GITHUB_SHA}" \
            --title "Android 테스트 빌드 #${{ github.run_number }}" \
            --notes "폰에서 아래 APK 파일을 눌러 받은 뒤 설치하세요. 설치 방법: docs/android-install.md (커밋 ${GITHUB_SHA::7})"
