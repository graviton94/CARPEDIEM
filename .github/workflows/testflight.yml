name: TestFlight

# 앱을 빌드·서명해 App Store Connect(TestFlight)에 올린다. Mac 없이 아이폰에서 테스트할 때 쓴다.
# 필요한 저장소 Secrets / Variables 는 docs/iphone-testing.md 참고.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          missing=""
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$BUNDLE_ID" ] || missing="$missing APP_BUNDLE_ID(variable)"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::저장소 설정이 없습니다:$missing (docs/iphone-testing.md)"; exit 1; fi
      - name: App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Generate project
        run: |
          python3 scripts/generate.py --check
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project CarpeDiem.xcodeproj -scheme CarpeDiem -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/CarpeDiem.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" APP_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 30
      - name: Upload to TestFlight
        working-directory: ios
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/CarpeDiem.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 30
      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
