name: Android release (Play)

# 스토어에 올릴 서명된 AAB 를 만든다. 손으로 실행 (Actions → Android release → Run workflow).
# 업로드 키: 저장소의 잠긴 키 (android/keystore/upload.jks.gpg, ‘Android signing key’ 워크플로가 만듦) 를
# Secrets 의 ANDROID_UPLOAD_PASSPHRASE 로 풀어 씀 (키스토어 · 키 암호도 같고 별칭은 upload).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload key is ready
        env:
          P: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: |
          if [ -z "$P" ] || [ ! -f android/keystore/upload.jks.gpg ]; then echo "::error::업로드 키가 없습니다 (Secrets 의 ANDROID_UPLOAD_PASSPHRASE 와 ‘Android signing key’ → upload 실행)"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          P: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
        run: gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 -d -o "$RUNNER_TEMP/upload.jks" android/keystore/upload.jks.gpg 3<<<"$P"
      - name: Build signed AAB
        working-directory: android
        env:
          CD_UPLOAD_STORE: ${{ runner.temp }}/upload.jks
          CD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          CD_UPLOAD_KEY_ALIAS: upload
          CD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSPHRASE }}
          CD_VERSION_NAME: ${{ inputs.version }}
        run: ./gradlew :core:test :app:bundleRelease
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: CarpeDiem-aab-${{ inputs.version }}
          path: android/app/build/outputs/bundle/release/*.aab
