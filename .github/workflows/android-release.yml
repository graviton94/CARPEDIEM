name: Android release (Play)

# 스토어에 올릴 서명된 AAB 를 만든다. 손으로 실행 (Actions → Android release → Run workflow).
# 필요한 GitHub Secrets (값은 채팅이 아니라 저장소 Settings → Secrets and variables → Actions 에만):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  업로드 키스토어(.jks)를 base64 로
#   ANDROID_UPLOAD_STORE_PASSWORD   키스토어 암호
#   ANDROID_UPLOAD_KEY_ALIAS        키 별칭
#   ANDROID_UPLOAD_KEY_PASSWORD     키 암호
on:
  workflow_dispatch:
    inputs:
      version:
        description: "버전 이름 (예: 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Secrets are set
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 가 없습니다. 저장소 Secrets 에 업로드 키를 넣어 주세요."; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Upload key
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB
        working-directory: android
        env:
          CD_UPLOAD_STORE: ${{ runner.temp }}/upload.jks
          CD_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          CD_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CD_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          CD_VERSION_NAME: ${{ inputs.version }}
        run: ./gradlew :core:test :app:bundleRelease
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: CarpeDiem-aab-${{ inputs.version }}
          path: android/app/build/outputs/bundle/release/*.aab
