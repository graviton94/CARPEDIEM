name: Android screenshots

# 에뮬레이터에서 디버그 APK 를 실행해 장면별 화면을 캡처하고 screenshots-android 브랜치에 올린다.
# 필요할 때만 돈다 (Actions 아끼기): 커밋 메시지에 [quick-shots] (빠른 장면들) · [full-shots] (전체) 가 있을 때, 또는 직접 실행.
# [quick-shots] 와 함께 [only q26 q31] 처럼 적으면 그 장면만, [locale ja-JP] 처럼 적으면 그 말로 찍는다.
on:
  workflow_dispatch:
    inputs:
      locale:
        description: "말 (예: ja-JP, zh-TW, en-US, 비우면 ko-KR)"
        default: ""
      only:
        description: "찍을 장면만 (예: q01 q26, 비우면 전부)"
        default: ""
      quick:
        description: "빠른 장면들만"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["android/**", "design/**", "scripts/android_shots.sh", ".github/workflows/android-screens.yml"]

concurrency:
  group: android-screens
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[quick-shots]') || contains(github.event.head_commit.message, '[full-shots]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Free disk space
        # 에뮬레이터 userdata 에 7GB 넘게 필요하다. 쓰지 않는 도구를 지운다.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MSG: ${{ github.event.head_commit.message }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          cores: 2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then export QUICK="${{ inputs.quick && '1' || '' }}" ONLY="${{ inputs.only }}" LOCALES="${{ inputs.locale }}"; else export QUICK="${{ contains(github.event.head_commit.message, '[quick-shots]') && '1' || '' }}" ONLY="$(echo "$MSG" | grep -o '\[only [^]]*\]' | head -1 | sed 's/^\[only //; s/\]$//')" LOCALES="$(echo "$MSG" | grep -o '\[locale [^]]*\]' | head -1 | sed 's/^\[locale //; s/\]$//')"; fi; bash scripts/android_shots.sh shots
      - name: Push to screenshots-android branch
        if: always()
        run: |
          mkdir -p shots && cd shots
          git init -q -b screenshots-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "source: ${GITHUB_SHA}" > SOURCE.txt
          git add -A && git commit -qm "android screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-android
